# See CONTRIBUTING.md for setup (`pip install pre-commit && pre-commit install`).
repos:
  # Lint + format. Runs repo-wide (ruff.toml excludes the vendored
  # HazyResearch/hyena-dna and spliceformer/spip vendor/ directories),
  # but only ever against files actually in a given commit -- adopting
  # this does not force a one-shot repo-wide reformat.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Deliberately scoped to the ACMG interpretation path only -- see
  # mypy.ini's own header comment for why (this is where the PM1 bug,
  # a None flowing where a residue number was expected, lived). The
  # `files:` regex here must stay in sync with mypy.ini's `files =`
  # list: it's what keeps pre-commit from invoking mypy (and mypy from
  # falling back to checking whatever files pre-commit *did* pass) on
  # commits that don't touch this path at all. Extended (report review
  # round 5, G1) to cover the rest of pvs1/, conflict_resolution_engine.py,
  # and provenance.py/models/status.py -- see mypy.ini for the full list.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        name: mypy (ACMG interpretation path)
        # `files:` decides WHEN this hook fires, not what mypy checks -- see
        # `pass_filenames: false` below. mypy.ini is in the list because a
        # commit changing only the type checker's configuration was otherwise
        # the one commit the type checker never ran on.
        files: ^mypy\.ini$|^\.pre-commit-config\.yaml$|^geper/pipeline/(acmg_rules|interpretation|interpretation_result|stage_schemas|conflict_resolution_engine|provenance)\.py$|^geper/pipeline/pvs1/(__init__|cache|decision_tree|lookup|models|utils)\.py$|^geper/pipeline/interpro/lookup\.py$|^geper/pipeline/models/status\.py$
        # REQUIRED, and not obvious: the upstream hook declares
        # `types_or: [python, pyi]`, which pre-commit ANDs with `files:`.
        # Adding mypy.ini to the regex alone therefore does NOTHING -- the
        # file is filtered out by TYPE before the regex is consulted, and the
        # hook still reports "(no files to check) Skipped". Measured, not
        # assumed -- twice: `ini` was added for mypy.ini, and `yaml` had to
        # be added for THIS file for exactly the same reason. A regex entry
        # without its type entry is inert.
        types_or: [python, pyi, ini, yaml]
        # Adding mypy.ini as a trigger would be wrong on its own for a second
        # reason: pre-commit would hand mypy an .ini as a file to type-check.
        # `pass_filenames: false` is what makes it right -- mypy receives no
        # filenames and checks the `files =` scope from mypy.ini itself. This
        # is the gitleaks shape: a hook that reads the commit cannot be
        # silenced by which files the commit contains.
        # COST, stated so nobody trims it later: mypy now checks the whole
        # configured scope on any commit that touches it, not only the changed
        # files. Slower, deliberately.
        pass_filenames: false
        args: [--config-file=mypy.ini]
        # mypy's pre-commit hook runs in its own isolated environment
        # (language: python) -- it doesn't inherit this project's venv,
        # so the pydantic plugin mypy.ini enables needs to be listed
        # here explicitly or it silently can't be imported.
        additional_dependencies: ["pydantic>=2.13,<3.0"]

  # Credential scanning -- catches an API key or token pasted into a
  # file before it's committed (relevant: one was pasted into chat
  # earlier this session, though never into a tracked file).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
