[pytest]
markers =
    real_pip: opt-in integration test that shells out to a real `pip install`/`pip uninstall` against whatever Python interpreter runs it. Never selected by a bare `pytest` invocation -- deliberately excluded by `addopts` below, since firing real pip against a SHARED interpreter (as opposed to a disposable/isolated one) has a demonstrated collision/removal risk. Run explicitly and only against a disposable environment via `pytest -m real_pip`.
    live_network: opt-in integration test that makes real HTTP calls to a third-party API (e.g. Ensembl REST) instead of a mock. Never selected by a bare `pytest` invocation -- deliberately excluded by `addopts` below, because a default CI run's job is telling you whether YOUR code broke, not whether a third party's infrastructure is up; an outage-driven red here is indistinguishable from a real regression and erodes trust in every other red. DEFAULT CI GREEN THEREFORE DOES NOT MEAN A LIVE-NETWORK CHECK PASSED -- that coverage (real third-party response shapes/values, as opposed to a mocked stand-in) is real but is not exercised by the default run. Run explicitly via `pytest -m live_network` when you need that coverage confirmed against the real API.
addopts = -m "not real_pip and not live_network"
